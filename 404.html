<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Cyber Pranava</title>
    <script>
      // Single Page Apps for GitHub Pages
      (function(history) {
        function redirect() {
          var path = location.pathname;
          if (path === '/cyberpranava/' || path === '/cyberpranava/index.html') {
            path = '/cyberpranava/home';
          }
          var newLocation = location.search + location.hash;
          newLocation = newLocation + (newLocation ? '&' : '?') + 'no-cache=' + Date.now();
          sessionStorage.redirect = path + newLocation;
        }
        window.addEventListener('beforeunload', redirect);
        if (sessionStorage.redirect) {
          var redirect = sessionStorage.redirect;
          delete sessionStorage.redirect;
          if (redirect.indexOf(location.pathname) === -1) {
            history.replaceState(null, null, redirect);
          }
        }
      })(window.history);
      
      // Redirect to the app
      var path = window.location.pathname;
      if (path === '/' || path === '/index.html') {
        window.location.href = '/cyberpranava/home';
      } else if (path.endsWith('/')) {
        window.location.href = path + 'home';
      } else if (path === '/cyberpranava') {
        window.location.href = '/cyberpranava/home';
      }
    </script>
  </head>
  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
    <!-- This div is where your app will be rendered -->
  </body>
</html>
